# Full stack: web UI + API on host port 18473 only.
# Postgres is internal (hostname `db`) and is not published.
#
#   docker compose up -d --build
#   open http://localhost:18473
#
# SQLite fallback when Docker bridge ICC cannot route web → db:
#   docker compose -f docker-compose.yml -f docker-compose.sqlite.yml up -d --build
# or: DATABASE_URL= docker compose up -d --no-deps --build web

name: daily-stock-analysis

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsa_internal}
      POSTGRES_DB: ${POSTGRES_DB:-dsa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dsa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsa} -d ${POSTGRES_DB:-dsa}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${HOST_PORT:-18473}:8000"
    environment:
      TZ: Asia/Shanghai
      WEBUI_HOST: 0.0.0.0
      ADMIN_AUTH_ENABLED: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-compose-secret}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://dsa:dsa_internal@db:5432/dsa}
      DATABASE_PATH: /app/data/stock_analysis.db
      API_STARTUP_TIMEOUT_SECONDS: ${API_STARTUP_TIMEOUT_SECONDS:-180}
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - app_reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dsa
    restart: unless-stopped

networks:
  dsa:

volumes:
  pgdata:
  app_data:
  app_logs:
  app_reports:
